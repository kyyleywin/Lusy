<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PunyaAing - Store</title>
    
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">PunyaAing</div>
        <div class="nav-menu" id="navMenu">
            <a href="index.html" class="nav-link">Home</a>
            <a href="#" class="nav-link" data-nav-cat="ikan">Ikan</a>
            <a href="#" class="nav-link" data-nav-cat="akun">Akun</a>
            <a href="#" class="nav-link" data-nav-cat="pay">Payment</a>
            <a href="#" class="nav-link" data-nav-cat="testimoni">Testimoni</a>
        </div>

        <div class="search" id="searchContainer">
            <button type="button" class="search-icon" id="searchIcon">
                <i class="fas fa-search"></i> 
            </button>
            <input type="text" placeholder="Cari..." id="searchInput">
        </div>

        <div id="hamburger" class="hamburger">
            <span></span><span></span><span></span>
        </div>
    </nav>

    <div id="overlay" class="overlay"></div>
    
    <div class="jumbotron-slider">
        <div class="slides">
            <img src="https://cdn.discordapp.com/attachments/1440347537172201492/1440597548787302420/optimize-image.webp?ex=691ebc84&is=691d6b04&hm=6d342e745824ce684d42ba6b366256e8fc17a9c9cfdcc0d8ff572c015a0feea3&" class="slide" alt="Slide 1">
            <img src="https://cdn.discordapp.com/attachments/1440347537172201492/1440597548292112536/jcxMIYwXDR.jpg?ex=691ebc84&is=691d6b04&hm=a6e0e6cb496cea6c63cbef0ca6368e06168aaf48371c42540a1115e734d45a3e&" class="slide" alt="Slide 2">
            <img src="https://cdn.discordapp.com/attachments/1440347537172201492/1440597547549724673/tipsmainfishit-primary.jpg?ex=691ebc84&is=691d6b04&hm=77643576dfd16da99ab137e46e696b7ae4faefcb7d3ef6b5b9695f95e16ee9e0&" class="slide" alt="Slide 3">
        </div>
    </div>

    <div class="category-slider">
        <button class="nav-btn left-btn">‹</button>
        <div class="category-wrapper">
            <div class="category-item active" data-category="ikan">Ikan</div>
            <div class="category-item" data-category="akun">Akun</div>
            <div class="category-item" data-category="pay">Payment</div>
            <div class="category-item" data-category="testimoni">Testimoni</div>
        </div>
        <button class="nav-btn right-btn">›</button>
    </div>

    <div class="game-section">
        <div class="game-grid" id="gameGrid"></div>
        
        <div class="game-grid-alt" id="gameGridAlt"></div>

        <button class="load-more" id="loadMoreBtn">Tampilkan Lebih Banyak</button>
    </div>
    
    <div id="lightbox" class="lightbox">
        <span class="close-lightbox">&times;</span>
        <button class="lightbox-btn prev-btn-lb">&#10094;</button>
        <img class="lightbox-content" id="lightboxImg">
        <div class="lightbox-caption" id="lightboxCaption"></div>
        <button class="lightbox-btn next-btn-lb">&#10095;</button>
    </div>

    <script src="lib/ikan/ikan.js"></script>
    <script src="lib/akun/akun.js"></script>
    <script src="lib/pay/pay.js"></script>
    <script src="lib/testimoni/testi.js"></script>

    <script src="assets/js/script.js"></script>
</body>
</html>
