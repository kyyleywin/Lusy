<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luscyy - Store</title>
    
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">Stock Luscy</div>
        <div class="nav-menu" id="navMenu">
            <a href="index.html" class="nav-link">Home</a>
            <a href="#" class="nav-link" data-nav-cat="ikan">Ikan</a>
            <a href="#" class="nav-link" data-nav-cat="akun">Akun</a>
            <a href="#" class="nav-link" data-nav-cat="rating">Rating</a>
            <a href="#" class="nav-link" data-nav-cat="pay">Payment</a>
            <a href="#" class="nav-link" data-nav-cat="testimoni">Testimoni</a>
        </div>

        <div class="search" id="searchContainer">
            <button type="button" class="search-icon" id="searchIcon">
                <i class="fas fa-search"></i> 
            </button>
            <input type="text" placeholder="Cari..." id="searchInput">
        </div>

        <div id="hamburger" class="hamburger">
            <span></span><span></span><span></span>
        </div>
    </nav>

    <div id="overlay" class="overlay"></div>
    
    <div class="jumbotron-slider">
        <div class="slides">
            <img src="https://cdn.discordapp.com/attachments/1440347537172201492/1441506930442109058/fishit-maja.jpg?ex=69220b72&is=6920b9f2&hm=8168406165d8b60c40356679f8b62e4a01492358910a465f1a6d5100ebc78e5b&" class="slide" alt="Slide 1">
            <img src="https://cdn.discordapp.com/attachments/1440347537172201492/1441506931088035890/fishit-mutasi.jpg?ex=69220b72&is=6920b9f2&hm=7d32c2652a08e21e10a8686942cb2e7dedf8ed97d223e4a5c2038131321784aa&" class="slide" alt="Slide 2">
            <img src="https://cdn.discordapp.com/attachments/1440347537172201492/1441506964269174844/fishit-worm.jpg?ex=69220b7a&is=6920b9fa&hm=93fc7c10cc4c89b9b8676e27b46d1b9d5e9686cdd26944fded68ba7a3affb023&" class="slide" alt="Slide 3">
            <img src="https://cdn.discordapp.com/attachments/1440347537172201492/1441506930135793795/fishit-mitos.webp?ex=69220b72&is=6920b9f2&hm=a6f51f0b043ef1a464e391ef5c99bfd3c970945a4767c5502aec9e25d10d158c&" class="slide" alt="Slide 4">
        </div>
    </div>

    <div class="category-slider">
        <button class="nav-btn left-btn">‹</button>
        <div class="category-wrapper">
            <div class="category-item active" data-category="ikan">Ikan</div>
            <div class="category-item" data-category="akun">Akun</div>
            <div class="category-item" data-category="rating"><i class="fas fa-star"></i> Rating</div>
            <div class="category-item" data-category="pay">Payment</div>
            <div class="category-item" data-category="testimoni">Testimoni</div>
        </div>
        <button class="nav-btn right-btn">›</button>
    </div>

    <div class="game-section">
        <div class="game-grid" id="gameGrid"></div>
        
        <div class="game-grid-alt" id="gameGridAlt"></div>

        <button class="load-more" id="loadMoreBtn">Tampilkan Lebih Banyak</button>
    </div>
    
    <div id="lightbox" class="lightbox">
        <span class="close-lightbox">&times;</span>
        <button class="lightbox-btn prev-btn-lb">&#10094;</button>
        <img class="lightbox-content" id="lightboxImg">
        <div class="lightbox-caption" id="lightboxCaption"></div>
        <button class="lightbox-btn next-btn-lb">&#10095;</button>
    </div>
    
    <div id="main-footer"></div>

    <script src="lib/ikan/ikan.js"></script>
    <script src="lib/akun/akun.js"></script>
    <script src="lib/pay/pay.js"></script>
    <script src="lib/testimoni/testi.js"></script>
    <script src="lib/rating/rate.js"></script>     
    <script src="lib/rating/rate-ui.js"></script>
    <script src="assets/js/footer.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
