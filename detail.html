<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Produk - Luscy Store</title>
    
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">Stock Luscy</div>
        <a href="index.html" class="nav-link" style="font-size: 14px; display: flex; align-items: center; gap: 5px;">
            <i class="fas fa-arrow-left"></i> Kembali
        </a>
    </nav>

    <div class="detail-page-spacer"></div>

    <div id="appDetail">
        <div style="text-align: center; padding: 80px; color: #666;">
            <i class="fas fa-circle-notch fa-spin fa-3x" style="color: var(--accent);"></i>
            <br><br><p>Sedang memuat data produk...</p>
        </div>
    </div>

    <script src="lib/ikan/ikan.js"></script>
    <script src="lib/akun/akun.js"></script>
    <script src="lib/produk/produk-ikan.js"></script>
    <script src="lib/produk/produk-akun.js"></script>

    <script>
        // Menggabungkan Database Varian
        const dbVarian = {
            ...((typeof varianIkan !== 'undefined') ? varianIkan : {}),
            ...((typeof varianAkun !== 'undefined') ? varianAkun : {})
        };

        document.addEventListener('DOMContentLoaded', () => {
          var link = document.querySelector("link[rel~='icon']");
            if (!link) {
                link = document.createElement('link');
                link.rel = 'icon';
                document.getElementsByTagName('head')[0].appendChild(link);
            }
            link.href = 'https://cdn.discordapp.com/attachments/1440347537172201492/1441069517546717314/IMG_20251120_211532.png?ex=69207412&is=691f2292&hm=0e86ea3065bb3d8a6ebd04e570ab245d4e9c1c61a6f5259f6fb247a632d9f49e&';
          
            const params = new URLSearchParams(window.location.search);
            const catParam = params.get('category');
            const prodParam = params.get('product');
            
            let productData = null;
            let db = [];

            if (catParam === 'ikan' && typeof dataIkan !== 'undefined') db = dataIkan;
            else if (catParam === 'akun' && typeof dataAkun !== 'undefined') db = dataAkun;

            if (db.length > 0 && prodParam) {
                productData = db.find(p => p.title === decodeURIComponent(prodParam));
            }

            if (productData) {
                renderDetail(productData, catParam);
            } else {
                document.getElementById('appDetail').innerHTML = `<div style="text-align:center; padding:50px; color:#fff;">Produk Tidak Ditemukan</div>`;
            }
        });

        function renderDetail(item, category) {
            const container = document.getElementById('appDetail');
            const publisher = category === 'ikan' ? 'Ikan Fish It' : 'Akun Fish It';
            const bannerSrc = item.main_img || item.img; 
            const thumbSrc = item.thumb_img || item.img; 

            // LOGIKA PEMILIHAN VARIAN
            let varianList = [];
            if (dbVarian[item.title]) {
                varianList = dbVarian[item.title];
            } else {
                if (category === 'ikan' && dbVarian['ikan_default']) varianList = dbVarian['ikan_default'];
                else if (category === 'akun' && dbVarian['akun_default']) varianList = dbVarian['akun_default'];
            }

            // Render Grid HTML
            let gridItemsHTML = '';
            
            if (varianList && varianList.length > 0) {
                varianList.forEach((varian) => {
                    const isSoldOut = varian.stock <= 0;
                    const stockText = isSoldOut ? 'Stok Habis' : `Sisa Stok: ${varian.stock}`;
                    const activeClass = isSoldOut ? 'sold-out' : '';
                    
                    // Update: Kirim juga data STOCK ke fungsi selectVarian
                    const clickEvent = isSoldOut ? '' : `onclick="selectVarian(this, '${varian.name}', ${varian.stock})"`;
                    const iconVarian = varian.img ? varian.img : thumbSrc;

                    gridItemsHTML += `
                    <div class="detail-item-card ${activeClass}" ${clickEvent}>
                        <img src="${iconVarian}" alt="Icon"> 
                        <div class="detail-item-info">
                            <div class="detail-item-title">${varian.name}</div>
                            <div class="detail-item-price">${varian.price}</div>
                            <div class="detail-item-stock">${stockText}</div>
                        </div>
                        ${isSoldOut ? '<div class="sold-out-badge">SOLD</div>' : ''}
                    </div>
                    `;
                });
            } else {
                gridItemsHTML = '<div style="color:#888; font-style:italic; grid-column:1/-1; text-align:center;">Belum ada varian tersedia.</div>';
            }

            container.innerHTML = `
                <div class="detail-header">
                    <div class="detail-banner"><img src="${bannerSrc}" alt="Banner"></div> 
                    <div class="detail-info-container">
                        <div class="detail-thumb"><img src="${thumbSrc}" alt="Thumb"></div>
                        <div class="detail-text">
                            <div class="detail-publisher">${publisher}</div>
                            <h1 class="detail-title">${item.title}</h1>
                            <div class="detail-subtitle">${item.desc}</div>
                        </div>
                    </div>
                </div>

                <div class="detail-features">
                    <div class="feature-box"><div class="feature-icon"><i class="fas fa-bolt"></i></div><div class="feature-text">Proses Kilat</div></div>
                    <div class="feature-box"><div class="feature-icon"><i class="fas fa-shield-alt"></i></div><div class="feature-text">100% Aman</div></div>
                    <div class="feature-box"><div class="feature-icon"><i class="fas fa-headset"></i></div><div class="feature-text">Layanan 24/7</div></div>
                </div>

                <div class="detail-tabs">
                    <button class="tab-btn active" onclick="switchTab('transaksi', this)">Transaksi</button>
                    <button class="tab-btn" onclick="switchTab('keterangan', this)">Keterangan</button>
                </div>

                <div class="detail-content">
                    <div id="tab-transaksi" class="tab-pane active">
                        
                        <h3 style="margin-top:0;"><i class="fas fa-th-large"></i> 1. Pilih Item</h3>
                        <div class="detail-item-grid">
                            ${gridItemsHTML}
                        </div>

                        <h3><i class="fas fa-user-edit"></i> 2. Masukkan Data</h3>
                        <form onsubmit="kirimPesanan(event, '${item.title}', '${category}')">
                            
                            <div class="form-group">
                                <label><i class="fas fa-user"></i> Nama </label>
                                <input type="text" id="usernameInput" class="form-control" placeholder="Masukkan Nama" required>
                            </div>

                            <div class="form-group">
                                <label><i class="fas fa-calculator"></i> Jumlah Order</label>
                                <input type="number" id="quantityInput" class="form-control" placeholder="Pilih item di atas dahulu..." min="1" disabled required>
                                <small id="stockInfo" style="color:#888; font-size:12px;">*Pilih varian di atas untuk melihat sisa stok.</small>
                            </div>

                            <input type="hidden" id="selectedItemInput" required>
                            <input type="hidden" id="maxStockInput"> <div id="errorMsg" style="color:red; font-size:13px; margin-bottom:10px; display:none;"></div>

                            <div class="form-group">
                                <label><i class="fas fa-wallet"></i> Metode Pembayaran</label>
                                <select class="form-control" id="paymentSelect">
                                    <option value="QRIS">QRIS (All Payment)</option>
                                    <option value="DANA">DANA</option>
                                    <option value="GoPay">GoPay</option>
                                    <option value="OVO">OVO</option>
                                    <option value="JAGO">Transfer Bank Jago</option>
                                </select>
                            </div>

                            <button type="submit" class="btn-process">
                                <i class="fab fa-whatsapp"></i> Beli Sekarang
                            </button>
                        </form>
                    </div>

                    <div id="tab-keterangan" class="tab-pane">
                        <div class="desc-container">
                            <div class="desc-box">
                                <div class="desc-header"><i class="fas fa-info-circle"></i> Tentang Produk</div>
                                <p class="desc-text">Halaman resmi pembelian <strong>${item.title}</strong>. Produk stock By Luscy!</p>
                            </div>
                            <div class="desc-section">
                                <div class="desc-header" style="padding-left:5px;"><i class="fas fa-list-ol"></i> Cara Order</div>
                                <ul class="step-list">
                                    <li class="step-item"><div class="step-number">1</div><div class="step-content">Pilih Item pada daftar di atas.</div></li>
                                    <li class="step-item"><div class="step-number">2</div><div class="step-content">Masukkan Username dan Jumlah yang ingin dibeli.</div></li>
                                    <li class="step-item"><div class="step-number">3</div><div class="step-content">Klik Beli Sekarang untuk lanjut ke WA.</div></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- LOGIKA SAAT VARIAN DIKLIK ---
        function selectVarian(element, itemName, stock) {
            // 1. Visual Effect (Border menyala)
            document.querySelectorAll('.detail-item-card').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');

            // 2. Simpan Nama Item
            document.getElementById('selectedItemInput').value = itemName;
            
            // 3. Atur Logic Jumlah Order berdasarkan Stok
            const qtyInput = document.getElementById('quantityInput');
            const stockInfo = document.getElementById('stockInfo');
            const maxStockInput = document.getElementById('maxStockInput');

            qtyInput.disabled = false; // Aktifkan input
            qtyInput.value = 1; // Reset ke 1
            qtyInput.max = stock; // Set batas maksimal input
            
            maxStockInput.value = stock; // Simpan stok max untuk validasi kirim
            stockInfo.textContent = `*Maksimal pembelian: ${stock} item (Sesuai sisa stok).`;
            stockInfo.style.color = "var(--accent)";

            // 4. Sembunyikan error
            document.getElementById('errorMsg').style.display = 'none';
        }

        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
            btnElement.classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        // --- LOGIKA KIRIM KE WHATSAPP ---
        function kirimPesanan(e, productName, category) {
            e.preventDefault();
            
            const username = document.getElementById('usernameInput').value;
            const selectedItem = document.getElementById('selectedItemInput').value;
            const quantity = parseInt(document.getElementById('quantityInput').value);
            const maxStock = parseInt(document.getElementById('maxStockInput').value);
            const payment = document.getElementById('paymentSelect').value;
            const errorBox = document.getElementById('errorMsg');

            // VALIDASI
            if(!selectedItem) {
                errorBox.textContent = "* Silakan pilih item di atas terlebih dahulu.";
                errorBox.style.display = 'block';
                document.querySelector('.detail-item-grid').scrollIntoView({behavior: 'smooth'});
                return;
            }

            if(quantity > maxStock) {
                alert(`Stok tidak cukup! Maksimal pembelian saat ini adalah ${maxStock}.`);
                return;
            }
            
            if(quantity < 1) {
                alert("Jumlah minimal pembelian adalah 1.");
                return;
            }

            // FORMAT PESAN WHATSAPP
            const adminNumber = "6285974488318"; // Ganti nomor admin di sini
            
            const text = `Halo Admin,%0A%0ASaya mau order:%0A` +
                         `👤 Username: *${username}*%0A` +
                         `📦 Produk: *${productName}*%0A` +
                         `🔹 Item: *${selectedItem}*%0A` +
                         `🔢 Jumlah: *${quantity}x*%0A` +
                         `💳 Pembayaran: *${payment}*%0A%0A` +
                         `Mohon diproses ya min.`;

            window.open(`https://wa.me/${adminNumber}?text=${text}`, '_blank');
        }
    </script>
</body>
</html>
